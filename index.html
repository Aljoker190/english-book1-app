<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="تطبيق المعهد التفاعلي لتعلم اللغة الإنجليزية">
  <title>معهد الإنجليزية التفاعلي</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

  <!-- الهيدر -->
  <header class="app-header">
    <button id="backBtn" class="icon-btn hidden" aria-label="رجوع">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M9 6l6 6-6 6" transform="scale(-1,1) translate(-24,0)"/></svg>
    </button>
    <h1 id="appTitle">📚 معهد الإنجليزية</h1>
    <button id="themeToggle" class="icon-btn" aria-label="تبديل الوضع الليلي">
      <span id="themeIcon">🌙</span>
    </button>
  </header>

  <!-- شريط التقدم العام -->
  <div class="progress-banner" id="progressBanner">
    <span>تقدّمك في Book 1</span>
    <div class="progress-track"><div class="progress-fill" id="overallProgress"></div></div>
    <span id="progressText">0%</span>
  </div>

  <!-- عرض الوحدات -->
  <main id="homeView" class="view"></main>

  <!-- عرض الدرس -->
  <main id="lessonView" class="view hidden">
    <div class="lesson-hero">
      <h2 id="lessonTitle"></h2>
      <p id="lessonSubtitle"></p>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="learn">📖 الشرح</button>
      <button class="tab" data-tab="quiz">📝 التمارين</button>
      <button class="tab" data-tab="tasks">✅ التقدم</button>
    </nav>

    <section id="tab-learn" class="tab-panel"></section>
    <section id="tab-quiz" class="tab-panel hidden"></section>
    <section id="tab-tasks" class="tab-panel hidden"></section>
  </main>

  <footer class="app-footer">
    <small>English Institute PWA • MVP v1.0</small>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
